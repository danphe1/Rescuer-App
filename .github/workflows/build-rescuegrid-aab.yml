name: Build RescueGrid AAB

on:
  push:
    branches: [main]
    paths:
      - 'android-build/**'
      - '.github/workflows/build-rescuegrid-aab.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build release Android App Bundle
        run: gradle -p android-build :app:bundleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: rescuegrid-responder-aab
          path: android-build/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
